name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: solo lectura del código fuente
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad-y-tests:
    name: Chequeos de seguridad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial para que gitleaks revise los commits
          persist-credentials: false

      - name: Instalar y ejecutar gitleaks (con hash verificado)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="HEAD"

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Auditoría de seguridad de dependencias
        run: npm audit --audit-level=high

      - name: Ejecutar tests con Vitest
        run: npm test

